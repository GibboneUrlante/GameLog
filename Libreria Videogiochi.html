<!DOCTYPE html>
<html lang="it" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>GameLog - Libreria Videogiochi</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Alpine.js -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

  <!-- Google Fonts Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <style>
    [x-cloak] { display: none !important; }
    body {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    input, select, textarea {
      font-size: 16px !important;
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen pb-24 font-sans antialiased selection:bg-indigo-500 selection:text-white" 
      x-data="gameApp()" 
      x-init="initApp()">

  <!-- HEADER FISSO IN ALTO -->
  <header class="sticky top-0 z-30 bg-slate-900/90 backdrop-blur-md border-b border-slate-800 px-4 py-3">
    <div class="flex items-center justify-between max-w-md mx-auto">
      <div class="flex items-center gap-2.5">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-indigo-600 to-violet-500 flex items-center justify-center text-white shadow-lg shadow-indigo-500/25">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 12L3.269 3.126A59.768 59.768 0 0121.485 12 59.77 59.77 0 013.27 20.876L5.999 12zm0 0h7.5"/>
          </svg>
        </div>
        <div>
          <h1 class="text-base font-bold leading-none text-white tracking-tight">GameLog</h1>
          <p class="text-[10px] text-slate-400 font-medium mt-0.5">Libreria personale</p>
        </div>
      </div>

      <button @click="openModal()" class="bg-indigo-600 hover:bg-indigo-500 active:scale-95 text-white px-3 py-1.5 rounded-xl text-xs font-semibold shadow-lg shadow-indigo-600/25 transition flex items-center gap-1.5">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15"/>
        </svg>
        <span>Aggiungi</span>
      </button>
    </div>
  </header>

  <main class="max-w-md mx-auto px-4 pt-4 space-y-4">

    <!-- DASHBOARD STATISTICHE -->
    <div class="grid grid-cols-4 gap-2 text-center">
      <div class="bg-slate-900/80 border border-slate-800/80 p-2.5 rounded-2xl shadow-sm">
        <span class="block text-[10px] font-semibold text-slate-400 uppercase tracking-wider">Totali</span>
        <span class="text-lg font-black text-slate-100" x-text="stats.total">0</span>
      </div>
      <div class="bg-slate-900/80 border border-slate-800/80 p-2.5 rounded-2xl shadow-sm">
        <span class="block text-[10px] font-semibold text-purple-400/90 uppercase tracking-wider">Wishlist</span>
        <span class="text-lg font-black text-purple-400" x-text="stats.wishlist">0</span>
      </div>
      <div class="bg-slate-900/80 border border-slate-800/80 p-2.5 rounded-2xl shadow-sm">
        <span class="block text-[10px] font-semibold text-amber-400/90 uppercase tracking-wider">Platinati</span>
        <span class="text-lg font-black text-amber-400" x-text="stats.platinati">0</span>
      </div>
      <div class="bg-slate-900/80 border border-slate-800/80 p-2.5 rounded-2xl shadow-sm">
        <span class="block text-[10px] font-semibold text-indigo-400/90 uppercase tracking-wider">Ore Tot.</span>
        <span class="text-lg font-black text-indigo-400" x-text="stats.hours + 'h'">0h</span>
      </div>
    </div>

    <!-- CONTROLLI: RICERCA E ORDINAMENTO -->
    <div class="space-y-3">
      <!-- Search Input -->
      <div class="relative">
        <input 
          type="text" 
          x-model="searchQuery" 
          placeholder="Cerca un titolo o piattaforma..." 
          class="w-full bg-slate-900 border border-slate-800 rounded-xl pl-10 pr-9 py-2.5 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition"
        >
        <svg class="w-4 h-4 absolute left-3.5 top-3.5 text-slate-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z"/>
        </svg>
        <button 
          x-show="searchQuery.length > 0" 
          @click="searchQuery = ''" 
          class="absolute right-3 top-3 text-slate-500 hover:text-slate-300">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
          </svg>
        </button>
      </div>

      <!-- Count & Sort -->
      <div class="flex items-center justify-between text-xs text-slate-400 px-0.5">
        <span>Mostrati: <strong class="text-slate-200 font-semibold" x-text="filteredGames.length">0</strong></span>
        <div class="flex items-center gap-1.5">
          <span class="text-slate-500 font-medium">Ordina:</span>
          <select x-model="sortBy" class="bg-slate-900 border border-slate-800 rounded-lg px-2.5 py-1 text-slate-200 focus:outline-none focus:border-indigo-500 text-xs font-medium">
            <option value="recent">Più recenti</option>
            <option value="title">Titolo (A-Z)</option>
            <option value="rating">Voto (10-1)</option>
            <option value="hours">Ore di gioco</option>
          </select>
        </div>
      </div>

      <!-- TAB STATUS HORIZONTAL SCROLL (No Cut-off) -->
      <div class="-mx-4 px-4 overflow-x-auto no-scrollbar flex items-center gap-2 py-1">
        <template x-for="status in statuses" :key="status.id">
          <button 
            @click="selectedStatus = status.id"
            :class="selectedStatus === status.id ? 'bg-indigo-600 text-white shadow-md shadow-indigo-600/30 font-semibold' : 'bg-slate-900 text-slate-400 border border-slate-800 hover:text-slate-200'"
            class="px-3.5 py-1.5 rounded-xl text-xs whitespace-nowrap transition active:scale-95 shrink-0">
            <span x-text="status.label"></span>
          </button>
        </template>
      </div>
    </div>

    <!-- LISTA GIOCHI -->
    <div class="space-y-3">
      <template x-for="game in filteredGames" :key="game.id">
        <div class="bg-slate-900 border border-slate-800/80 rounded-2xl p-3.5 shadow-sm relative overflow-hidden flex flex-col gap-2.5">
          
          <!-- Colored Status Indicator Bar -->
          <div 
            class="absolute top-0 left-0 bottom-0 w-1"
            :class="{
              'bg-purple-500': game.status === 'wishlist',
              'bg-slate-600': game.status === 'backlog',
              'bg-indigo-500': game.status === 'playing',
              'bg-emerald-500': game.status === 'completed',
              'bg-amber-400': game.status === 'platinum'
            }">
          </div>

          <div class="pl-2 flex items-start justify-between gap-2">
            <div class="space-y-1">
              <div class="flex items-center gap-2 flex-wrap">
                <span :class="getStatusBadgeClass(game.status)" class="text-[10px] font-bold px-2 py-0.5 rounded-md uppercase tracking-wider" x-text="getStatusLabel(game.status)"></span>
                <span class="text-[10px] text-slate-300 font-semibold bg-slate-800 px-2 py-0.5 rounded-md border border-slate-700/50" x-text="game.platform"></span>
              </div>
              <h3 class="text-base font-bold text-slate-100 leading-snug" x-text="game.title"></h3>
            </div>

            <!-- Voto (nascosto se in Wishlist o se 0) -->
            <template x-if="game.status !== 'wishlist' && game.rating">
              <div class="flex items-center gap-1 bg-amber-500/10 border border-amber-500/20 px-2 py-0.5 rounded-lg shrink-0">
                <span class="text-amber-400 text-xs">★</span>
                <span class="text-xs font-bold text-amber-300" x-text="game.rating + '/10'"></span>
              </div>
            </template>
          </div>

          <!-- Bottom Card details: Hours & Actions -->
          <div class="pl-2 flex items-center justify-between text-xs text-slate-400 pt-2 border-t border-slate-800/60">
            <div>
              <template x-if="game.status !== 'wishlist'">
                <span class="font-medium text-slate-300 flex items-center gap-1">
                  ⏱️ <span x-text="game.hours"></span> ore
                </span>
              </template>
              <template x-if="game.status === 'wishlist'">
                <span class="italic text-purple-400/90 text-[11px] font-medium">In Lista Desideri</span>
              </template>
            </div>

            <!-- SVG Action Icons (Inlined to prevent missing icon bugs) -->
            <div class="flex items-center gap-1">
              <!-- Menu Spostamento Rapido -->
              <div class="relative" x-data="{ openSwap: false }">
                <button 
                  @click="openSwap = !openSwap" 
                  class="p-1.5 text-slate-400 hover:text-indigo-400 active:scale-95 rounded-lg hover:bg-slate-800 transition" 
                  title="Sposta Categoria">
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M7.5 21 3 16.5m0 0L7.5 12M3 16.5h13.5m0-13.5L21 7.5m0 0L16.5 12M21 7.5H7.5"/>
                  </svg>
                </button>

                <div 
                  x-show="openSwap" 
                  @click.outside="openSwap = false" 
                  x-cloak 
                  x-transition
                  class="absolute right-0 bottom-full mb-2 w-40 bg-slate-800 border border-slate-700 rounded-xl shadow-2xl z-20 py-1 text-xs">
                  <div class="px-3 py-1 font-bold text-[10px] text-slate-400 uppercase border-b border-slate-700/60">Sposta in:</div>
                  <template x-for="st in statuses.filter(s => s.id !== 'all')" :key="st.id">
                    <button 
                      @click="quickMove(game, st.id); openSwap = false" 
                      class="w-full text-left px-3 py-1.5 hover:bg-slate-700 text-slate-200 flex items-center justify-between">
                      <span x-text="st.label"></span>
                      <span x-show="game.status === st.id" class="text-indigo-400 font-bold">✓</span>
                    </button>
                  </template>
                </div>
              </div>

              <!-- Modifica -->
              <button 
                @click="editGame(game)" 
                class="p-1.5 text-slate-400 hover:text-white active:scale-95 rounded-lg hover:bg-slate-800 transition" 
                title="Modifica">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="m16.862 4.487 1.687-1.688a1.875 1.875 0 1 1 2.652 2.652L10.582 16.07a4.5 4.5 0 0 1-1.897 1.13L6 18l.8-2.685a4.5 4.5 0 0 1 1.13-1.897l8.932-8.931Zm0 0L19.5 7.125M18 14v4.75A2.25 2.25 0 0 1 15.75 21H5.25A2.25 2.25 0 0 1 3 18.75V8.25A2.25 2.25 0 0 1 5.25 6H10"/>
                </svg>
              </button>

              <!-- Elimina -->
              <button 
                @click="deleteGame(game.id)" 
                class="p-1.5 text-slate-400 hover:text-rose-400 active:scale-95 rounded-lg hover:bg-slate-800 transition" 
                title="Elimina">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="m14.74 9-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 0 1-2.244 2.077H8.084a2.25 2.25 0 0 1-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 0 0-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 0 1 3.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 0 0-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 0 0-7.5 0"/>
                </svg>
              </button>
            </div>
          </div>

          <!-- Note -->
          <template x-if="game.notes && game.notes.trim() !== ''">
            <p class="pl-2 text-xs text-slate-400 italic bg-slate-950/40 p-2 rounded-lg border border-slate-800/40 line-clamp-2" x-text="'&quot;' + game.notes + '&quot;'"></p>
          </template>

        </div>
      </template>

      <!-- Empty State -->
      <div x-show="filteredGames.length === 0" class="text-center py-12 px-4 space-y-3 bg-slate-900/40 rounded-2xl border border-dashed border-slate-800">
        <div class="text-4xl">🎮</div>
        <p class="text-sm font-semibold text-slate-300">Nessun gioco in questa vista</p>
        <p class="text-xs text-slate-500 max-w-xs mx-auto">Prova a cambiare il filtro o aggiungi un nuovo titolo alla libreria.</p>
      </div>
    </div>

    <!-- SEZIONE BACKUP & DATI -->
    <div class="pt-6 border-t border-slate-800 flex justify-between items-center text-xs text-slate-500">
      <button @click="exportData()" class="hover:text-slate-300 underline font-medium">Esporta Backup (JSON)</button>
      <label class="hover:text-slate-300 underline font-medium cursor-pointer">
        Importa Backup
        <input type="file" @change="importData($event)" accept=".json" class="hidden">
      </label>
    </div>

  </main>

  <!-- MODALE MODIFICA / INSERIMENTO -->
  <div 
    x-show="isModalOpen" 
    x-cloak 
    x-transition:enter="transition ease-out duration-300"
    x-transition:enter-start="opacity-0"
    x-transition:enter-end="opacity-100"
    x-transition:leave="transition ease-in duration-200"
    x-transition:leave-start="opacity-100"
    x-transition:leave-end="opacity-0"
    class="fixed inset-0 z-50 flex items-end sm:items-center justify-center bg-slate-950/80 backdrop-blur-sm p-0 sm:p-4" 
    @keydown.escape.window="closeModal()">
    
    <div 
      @click.outside="closeModal()" 
      class="bg-slate-900 border-t sm:border border-slate-800 w-full max-w-md rounded-t-3xl sm:rounded-2xl max-h-[90vh] overflow-y-auto p-5 space-y-4 shadow-2xl">
      
      <div class="flex items-center justify-between border-b border-slate-800 pb-3">
        <h2 class="text-base font-bold text-slate-100" x-text="form.id ? 'Modifica Gioco' : 'Aggiungi Nuovo Gioco'"></h2>
        <button @click="closeModal()" class="text-slate-400 hover:text-white p-1">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
          </svg>
        </button>
      </div>

      <form @submit.prevent="saveGame()" class="space-y-4">
        <!-- Titolo -->
        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1">TITOLO GIOCO *</label>
          <input 
            type="text" 
            x-model="form.title" 
            required 
            placeholder="Es. Elden Ring, Zelda: TOTK..." 
            class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-sm text-slate-100 focus:outline-none focus:border-indigo-500"
          >
        </div>

        <!-- Piattaforma & Stato -->
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-slate-400 mb-1">PIATTAFORMA</label>
            <select x-model="form.platform" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-sm text-slate-100 focus:outline-none focus:border-indigo-500">
              <option value="PS5">PlayStation 5</option>
              <option value="PS4">PlayStation 4</option>
              <option value="Switch">Nintendo Switch</option>
              <option value="PC">PC Steam/Epic</option>
              <option value="Xbox">Xbox Series / One</option>
              <option value="Altro">Altro</option>
            </select>
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-400 mb-1">STATO</label>
            <select x-model="form.status" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-sm text-slate-100 focus:outline-none focus:border-indigo-500">
              <option value="wishlist">Da acquistare</option>
              <option value="backlog">Da iniziare</option>
              <option value="playing">Iniziato</option>
              <option value="completed">Completato</option>
              <option value="platinum">Platinato 🏆</option>
            </select>
          </div>
        </div>

        <!-- Ore & Voto 1-10 (Nascosti se Wishlist) -->
        <div x-show="form.status !== 'wishlist'" class="grid grid-cols-2 gap-3 pt-1" x-transition>
          <div>
            <label class="block text-xs font-semibold text-slate-400 mb-1">ORE DI GIOCO</label>
            <input 
              type="number" 
              min="0" 
              step="0.5" 
              x-model="form.hours" 
              placeholder="0" 
              class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-sm text-slate-100 focus:outline-none focus:border-indigo-500"
            >
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-400 mb-1">VOTO (1 - 10)</label>
            <select x-model="form.rating" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-sm text-slate-100 focus:outline-none focus:border-indigo-500">
              <option value="">Nessuno</option>
              <template x-for="n in 10" :key="n">
                <option :value="n" x-text="n + ' / 10'"></option>
              </template>
            </select>
          </div>
        </div>

        <!-- Note -->
        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1">NOTE PERSONALI</label>
          <textarea 
            x-model="form.notes" 
            rows="2" 
            placeholder="Impressioni, trofei mancanti, ecc..." 
            class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-sm text-slate-100 focus:outline-none focus:border-indigo-500 resize-none"></textarea>
        </div>

        <!-- Tasti Azione -->
        <div class="flex gap-2 pt-2">
          <button type="button" @click="closeModal()" class="w-1/3 bg-slate-800 hover:bg-slate-700 text-slate-300 font-semibold py-2.5 rounded-xl text-xs">Annulla</button>
          <button type="submit" class="w-2/3 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-2.5 rounded-xl text-xs shadow-lg shadow-indigo-600/30">Salva</button>
        </div>
      </form>
    </div>
  </div>

  <!-- SCRIPT LOGIC ALPINE.JS -->
  <script>
    function gameApp() {
      return {
        games: [],
        searchQuery: '',
        selectedStatus: 'all',
        sortBy: 'recent',
        isModalOpen: false,
        form: { id: null, title: '', platform: 'PS5', status: 'playing', hours: 0, rating: '', notes: '' },
        
        statuses: [
          { id: 'all', label: 'Tutti' },
          { id: 'wishlist', label: 'Wishlist' },
          { id: 'backlog', label: 'Da Iniziare' },
          { id: 'playing', label: 'Iniziati' },
          { id: 'completed', label: 'Finiti' },
          { id: 'platinum', label: 'Platinati' }
        ],

        initApp() {
          const saved = localStorage.getItem('gamelog_data_v2');
          if (saved) {
            try { 
              this.games = JSON.parse(saved); 
            } catch(e) { 
              this.games = []; 
            }
          } else {
            // Dati d'esempio se vuoto
            this.games = [
              { id: 1, title: 'Elden Ring', platform: 'PS5', status: 'platinum', hours: 140, rating: 10, notes: 'Capolavoro assoluto', createdAt: Date.now() - 300000 },
              { id: 2, title: 'GTA VI', platform: 'PS5', status: 'wishlist', hours: 0, rating: '', notes: 'Day one obbligatorio', createdAt: Date.now() - 200000 },
              { id: 3, title: 'Zelda TOTK', platform: 'Switch', status: 'playing', hours: 45, rating: 9, notes: 'Esplorazione fantastica', createdAt: Date.now() - 100000 }
            ];
            this.saveToStorage();
          }
        },

        saveToStorage() {
          localStorage.setItem('gamelog_data_v2', JSON.stringify(this.games));
        },

        get stats() {
          const playedGames = this.games.filter(g => g.status !== 'wishlist');
          const hours = playedGames.reduce((acc, g) => acc + (parseFloat(g.hours) || 0), 0);
          return {
            total: playedGames.length,
            wishlist: this.games.filter(g => g.status === 'wishlist').length,
            platinati: this.games.filter(g => g.status === 'platinum').length,
            hours: Math.round(hours * 10) / 10
          };
        },

        get filteredGames() {
          return this.games
            .filter(g => {
              const matchSearch = g.title.toLowerCase().includes(this.searchQuery.toLowerCase()) || 
                                  g.platform.toLowerCase().includes(this.searchQuery.toLowerCase());
              const matchStatus = this.selectedStatus === 'all' ? true : g.status === this.selectedStatus;
              return matchSearch && matchStatus;
            })
            .sort((a, b) => {
              if (this.sortBy === 'title') return a.title.localeCompare(b.title);
              if (this.sortBy === 'rating') return (b.rating || 0) - (a.rating || 0);
              if (this.sortBy === 'hours') return (b.hours || 0) - (a.hours || 0);
              return b.createdAt - a.createdAt;
            });
        },

        openModal(game = null) {
          if (game) {
            this.form = { ...game };
          } else {
            this.form = { id: null, title: '', platform: 'PS5', status: 'playing', hours: 0, rating: '', notes: '' };
          }
          this.isModalOpen = true;
        },

        closeModal() {
          this.isModalOpen = false;
        },

        saveGame() {
          if (!this.form.title.trim()) return;
          
          if (this.form.id) {
            const index = this.games.findIndex(g => g.id === this.form.id);
            if (index !== -1) this.games[index] = { ...this.form };
          } else {
            this.games.unshift({
              ...this.form,
              id: Date.now(),
              createdAt: Date.now()
            });
          }
          this.saveToStorage();
          this.closeModal();
        },

        quickMove(game, newStatus) {
          game.status = newStatus;
          this.saveToStorage();
        },

        deleteGame(id) {
          this.games = this.games.filter(g => g.id !== id);
          this.saveToStorage();
        },

        editGame(game) {
          this.openModal(game);
        },

        getStatusBadgeClass(status) {
          switch(status) {
            case 'wishlist': return 'bg-purple-500/20 text-purple-400 border border-purple-500/30';
            case 'backlog': return 'bg-slate-700/50 text-slate-300 border border-slate-600/30';
            case 'playing': return 'bg-indigo-500/20 text-indigo-400 border border-indigo-500/30';
            case 'completed': return 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30';
            case 'platinum': return 'bg-amber-500/20 text-amber-400 border border-amber-500/30';
            default: return 'bg-slate-800 text-slate-400';
          }
        },

        getStatusLabel(status) {
          const found = this.statuses.find(s => s.id === status);
          return found ? found.label : status;
        },

        exportData() {
          const blob = new Blob([JSON.stringify(this.games, null, 2)], { type: 'application/json' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `gamelog_backup_${new Date().toISOString().slice(0,10)}.json`;
          a.click();
        },

        importData(event) {
          const file = event.target.files[0];
          if (!file) return;
          const reader = new FileReader();
          reader.onload = (e) => {
            try {
              const imported = JSON.parse(e.target.result);
              if (Array.isArray(imported)) {
                this.games = imported;
                this.saveToStorage();
              }
            } catch(err) {
              // Ignore invalid format
            }
          };
          reader.readAsText(file);
        }
      }
    }
  </script>
</body>
</html>
